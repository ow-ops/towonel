[package]
name = "towonel-mesh"
version.workspace = true
rust-version.workspace = true
edition = "2024"
publish = false

[dependencies]
towonel-common = { path = "../towonel-common" }
anyhow = { workspace = true }
hex = { workspace = true }
iroh = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "io-util", "net"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tun-rs = { workspace = true, optional = true }

[dev-dependencies]
fips204 = { workspace = true }

[features]
# Linux/macOS/Windows TUN device. Mobile apps feed packets through FFI instead.
tun = ["dep:tun-rs"]

[lints]
workspace = true
