suite: agent prometheusrule
templates:
  - prometheusrule.yaml.tpl
tests:
  - it: is not rendered by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the agent alert rules when enabled
    set:
      monitoring.prometheusRule.enabled: true
    asserts:
      - isKind:
          of: PrometheusRule
      - equal:
          path: spec.groups[0].name
          value: towonel-agent.rules
      - equal:
          path: spec.groups[0].rules[0].alert
          value: TowonelAgentEdgeLinkDown

  - it: alerts on the mesh only when it is enabled
    set:
      monitoring.prometheusRule.enabled: true
      mesh.enabled: true
      mesh.authKeySecret.name: mesh-key
      mesh.services:
        - port: 5432
          origin: pg:5432
    asserts:
      - equal:
          path: spec.groups[0].rules[4].alert
          value: TowonelAgentMeshDown

  - it: has no mesh alert without the mesh
    set:
      monitoring.prometheusRule.enabled: true
    asserts:
      - notExists:
          path: spec.groups[0].rules[4]

  - it: alerts on connected replicas that accept no traffic
    set:
      monitoring.prometheusRule.enabled: true
      monitoring.prometheusRule.additionalRuleLabels.team: tunnels
    asserts:
      - equal:
          path: spec.groups[0].rules[3].alert
          value: TowonelAgentStalled
      - equal:
          path: spec.groups[0].rules[3].for
          value: 15m
      - matchRegex:
          path: spec.groups[0].rules[3].expr
          pattern: 'and on \(cluster, namespace, job\) sum by \(cluster, namespace, job\)'
      - matchRegex:
          path: spec.groups[0].rules[3].expr
          pattern: 'towonel_agent_edge_session_state.*== 1'
      - equal:
          path: spec.groups[0].rules[3].labels.team
          value: tunnels
