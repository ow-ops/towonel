---
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    runs-on: light
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: https://github.com/dtolnay/rust-toolchain@1.96.0
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: docker
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_BUCKET: ow-oops-sccache
      SCCACHE_ENDPOINT: https://s3.gra.io.cloud.ovh.net
      SCCACHE_REGION: gra
      SCCACHE_S3_USE_SSL: "true"
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: https://github.com/dtolnay/rust-toolchain@1.96.0
      - uses: https://github.com/actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-
      - uses: https://github.com/taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: sccache
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: docker
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_BUCKET: ow-oops-sccache
      SCCACHE_ENDPOINT: https://s3.gra.io.cloud.ovh.net
      SCCACHE_REGION: gra
      SCCACHE_S3_USE_SSL: "true"
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      TOWONEL_TEST_POSTGRES_URL: postgres://postgres:postgres@postgres/towonel
    services:
      postgres:
        image: postgres:19@sha256:4ea94de574c17f0372722806c949757050fbb1cd7648410fe45d6bba275cc00e
        env:
          POSTGRES_DB: towonel
          POSTGRES_PASSWORD: postgres
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: https://github.com/dtolnay/rust-toolchain@1.96.0
      - uses: https://github.com/actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-
      - uses: https://github.com/taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-nextest,sccache
      - run: cargo nextest run --workspace --all-features --no-fail-fast
      # Same package selection as the run above, so nothing recompiles.
      - run: cargo nextest run --workspace --all-features --run-ignored only -E 'package(towonel-node) & test(postgres)'
      - run: sccache --show-stats
        if: always()

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: https://github.com/dtolnay/rust-toolchain@1.96.0
      - uses: https://github.com/taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-deny
      - run: cargo deny --all-features check

  machete:
    runs-on: light
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: https://github.com/taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-machete
      - run: cargo-machete

  typos:
    runs-on: light
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: https://github.com/taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: typos-cli
      - run: typos

  taplo:
    runs-on: light
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: https://github.com/taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: taplo-cli
      - run: taplo fmt --check

  helm:
    runs-on: light
    env:
      # renovate: datasource=github-releases depName=helm-unittest/helm-unittest
      HELM_UNITTEST_VERSION: "1.1.1"
      # renovate: datasource=github-releases depName=norwoodj/helm-docs
      HELM_DOCS_VERSION: "1.14.2"
      # renovate: datasource=github-releases depName=dadav/helm-schema
      HELM_SCHEMA_VERSION: "0.23.5"
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: https://github.com/azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          # Stay on Helm 3: Helm 4 mandates plugin provenance verification,
          # which helm-unittest's git source does not support.
          version: v3.22.1
      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version "v${HELM_UNITTEST_VERSION}"
      - name: Install helm-docs and helm-schema
        run: |
          set -euo pipefail
          install_release() {
            local archive="$1" url="$2" checksums="$3" bin="$4"
            curl -fsSL -o "${archive}" "${url}/${archive}"
            curl -fsSL "${url}/${checksums}" | grep "[[:space:]]${archive}\$" | sha256sum -c -
            tar -xzf "${archive}" "${bin}"
            install -m 0755 "${bin}" /usr/local/bin/
            rm -f "${archive}" "${bin}"
          }
          install_release "helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz" \
            "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}" \
            checksums.txt helm-docs
          install_release "helm-schema_${HELM_SCHEMA_VERSION}_Linux_x86_64.tar.gz" \
            "https://github.com/dadav/helm-schema/releases/download/${HELM_SCHEMA_VERSION}" \
            checksums.txt helm-schema
      - name: Build chart dependencies
        run: |
          set -euo pipefail
          helm repo add bjw-s https://bjw-s-labs.github.io/helm-charts
          for chart in charts/*/; do
            helm dependency build "$chart"
          done
      - name: Lint charts
        run: |
          set -euo pipefail
          for chart in charts/*/; do
            helm lint "$chart"
          done
      - name: Run chart unit tests
        run: helm unittest charts/*
      - name: Check chart docs are current
        run: |
          set -euo pipefail
          cp deploy/grafana/towonel-hub.json charts/towonel-node/dashboards/towonel-node.json
          cp deploy/grafana/towonel-agent.json charts/towonel-agent/dashboards/towonel-agent.json
          helm-docs --chart-search-root=charts --log-level=warn
          helm-schema --chart-search-root charts --skip-auto-generation required,additionalProperties --append-newline
          git diff --exit-code charts/*/README.md charts/*/values.schema.json charts/*/dashboards

  e2e:
    if: github.ref == 'refs/heads/main'
    runs-on: docker
    env:
      ENABLE_SCCACHE: "1"
      SCCACHE_AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      SCCACHE_AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: make e2e
      - run: make e2e-tls
